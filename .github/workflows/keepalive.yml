name: Keep accounts online
# Supabase pauses free projects after a week without activity.
# This pings the database every 3 days so sign-in never goes offline.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY="sb_publishable_pBCLKvw2ohvGkEjI6Ql_Tg_axI4vplc"
          URL="https://cskmxkpxpybhrewwgiqb.supabase.co"
          curl -sS -o /dev/null -w "rest %{http_code}\n" "$URL/rest/v1/linked_keys?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -sS -o /dev/null -w "auth %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
